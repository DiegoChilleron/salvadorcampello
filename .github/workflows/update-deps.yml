name: Update dependencies

on:
  schedule:
    # Lunes a las 06:00 UTC (07:00/08:00 en España según horario de verano)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Nivel de actualización'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - latest

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    outputs:
      updated: ${{ steps.commit.outputs.updated }}
      sha: ${{ steps.commit.outputs.sha }}

    env:
      TARGET: ${{ inputs.target || 'minor' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Bump versions in package.json
        run: npx --yes npm-check-updates --upgrade --target "$TARGET"

      - name: Install dependencies
        run: npm install

      - name: Audit fix (solo cambios no disruptivos)
        run: npm audit fix || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin actualizaciones disponibles."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- package.json package-lock.json
          fi

      # A partir de aquí, todo se salta si no hay nada que actualizar
      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Build static site
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push to main
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(deps): actualizar dependencias ($TARGET)" \
                     -m "Actualización automática verificada con lint + build en CI."
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Majores pendientes (requieren revisión manual)
        if: always()
        run: npx --yes npm-check-updates --target latest --format group || true
